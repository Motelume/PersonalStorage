name: Windows tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ocr.txt -r requirements-optional.txt
      - run: python -X utf8 -W error::ResourceWarning -m unittest discover -s tests -q
