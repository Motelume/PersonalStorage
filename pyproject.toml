[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personalstorage"
version = "0.10.0b4"
description = "Windows local document organization with preview, audit and safe moves"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf"]
ocr = ["rapidocr==3.4.2", "onnxruntime==1.31.1", "pypdfium2==5.14.0", "Pillow>=11", "pypdf"]
desktop = ["pywebview==6.2.1", "pypdf", "rapidocr==3.4.2", "onnxruntime==1.31.1", "pypdfium2==5.14.0", "Pillow>=11"]

[project.scripts]
personalstorage = "personalstorage.cli:main"

[tool.setuptools.packages.find]
include = ["personalstorage*"]

[tool.setuptools.package-data]
personalstorage = ["web_static/*", "templates/*"]
