[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personalstorage"
version = "0.6.0"
description = "Windows local document organization with preview, audit and safe moves"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf"]
desktop = ["pywebview==6.2.1", "pypdf"]

[project.scripts]
personalstorage = "personalstorage.cli:main"

[tool.setuptools.packages.find]
include = ["personalstorage*"]

[tool.setuptools.package-data]
personalstorage = ["web_static/*", "templates/*"]
